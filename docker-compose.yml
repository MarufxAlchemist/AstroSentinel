##############################################################################
# docker-compose.yml — Cosmic Alert System (DEFAULT / LOCAL)
#
# Quick-start for local testing. Equivalent to the prod compose
# but with `restart: unless-stopped` instead of `restart: always`.
#
# Run: docker compose up --build
#
# For dedicated environments, prefer:
#   Production:  docker compose -f docker-compose.prod.yml up --build
#   Development: docker compose -f docker-compose.dev.yml up --build
#
# Services
# ────────
#   postgres        PostgreSQL 16-alpine          :5432
#   migrate         drizzle-kit migrate (one-shot)
#   python-backend  FastAPI + uvicorn              :8001
#   api-server      Express + WebSocket + Drizzle  :8000
#   frontend        nginx (Vite bundle)            :5173
#
# Startup order (healthcheck-based)
# ──────────────────────────────────
#   postgres (healthy)
#       ↓
#   migrate (completed_successfully)  ← runs drizzle-kit migrate
#       ↓
#   python-backend (healthy)
#       ↓
#   api-server (healthy)   ← all three above
#       ↓
#   frontend
##############################################################################

services:

  # ── 1. PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-Astro-sentinel}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - cosmic

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Astro-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 2. Database migrations (one-shot) ─────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile

    restart: "no"

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URLENC}@postgres:5432/${POSTGRES_DB:-Astro-sentinel}"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cosmic

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ── 3. Python backend (GCN Kafka consumer + FastAPI WebSocket) ─────────────
  python-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "8001:8001"

    networks:
      - cosmic

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 4. API server (Express + Drizzle ORM + WebSocket) ─────────────────────
  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile

    restart: unless-stopped

    environment:
      PORT:                 "8000"
      NODE_ENV:             production

      DATABASE_URL:         "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URLENC}@postgres:5432/${POSTGRES_DB:-Astro-sentinel}"
      PYTHON_BACKEND_URL:   "ws://python-backend:8001/api/ws"

      JWT_SECRET:           ${JWT_SECRET}
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID}

      GEMINI_API_KEY:       ${GEMINI_API_KEY}
      GEMINI_MODEL:         ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_MS:    ${GEMINI_TIMEOUT_MS:-45000}

      ORCID_CLIENT_ID:      ${ORCID_CLIENT_ID}
      ORCID_CLIENT_SECRET:  ${ORCID_CLIENT_SECRET}

    ports:
      - "8000:8000"

    networks:
      - cosmic

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      python-backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "node --input-type=module -e \"fetch('http://localhost:8000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── 5. Frontend (nginx serving Vite bundle + /api proxy) ──────────────────
  frontend:
    build:
      context: .
      dockerfile: artifacts/astro-sentinel/Dockerfile

    restart: unless-stopped

    ports:
      - "5173:5173"

    networks:
      - cosmic

    depends_on:
      api-server:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  cosmic:
    driver: bridge
