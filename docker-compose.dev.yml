##############################################################################
# docker-compose.dev.yml — Cosmic Alert System (DEVELOPMENT)
#
# Containerizes backend services only. Run with:
#   docker compose -f docker-compose.dev.yml up --build
#
# Then start the frontend locally:
#   cd artifacts/astro-sentinel && pnpm dev
#
# Why no frontend container in dev?
#   vite.config.ts hardcodes the Vite proxy target as http://127.0.0.1:8000.
#   When the frontend runs locally (not in Docker), localhost:8000 on the
#   developer's machine maps to the api-server container via the exposed port.
#   This makes the hardcoded proxy work correctly without modifying any code.
#
# Services
# ────────
#   postgres        PostgreSQL 16-alpine  :5432
#   migrate         drizzle-kit migrate   (one-shot)
#   python-backend  FastAPI --reload      :8001
#   api-server      Express (pnpm dev)    :8000
#
# Live reload
#   python-backend: uvicorn --reload + source volume mounted from ./backend/app
#   api-server:     pnpm dev (build + start) + source volumes mounted
#                   Changes to src/ → restart container to rebuild
##############################################################################

services:

  # ── 1. PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-Astro-sentinel}

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - cosmic-dev

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Astro-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ── 2. Database migrations (one-shot) ─────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile

    restart: "no"

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URLENC}@postgres:5432/${POSTGRES_DB:-Astro-sentinel}"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cosmic-dev

    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "1"

  # ── 3. Python backend — live reload via uvicorn --reload ──────────────────
  python-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    # Override CMD with --reload for development hot-reloading.
    # uvicorn --reload watches for .py file changes and restarts automatically.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

    restart: unless-stopped

    env_file:
      - ./backend/.env

    # Mount source so file changes trigger uvicorn --reload without rebuild.
    volumes:
      - ./backend/app:/app/app

    ports:
      - "8001:8001"

    networks:
      - cosmic-dev

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ── 4. API server — dev build mode ────────────────────────────────────────
  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
      # Use the builder stage: has all dev deps, TypeScript source, and
      # the full pnpm workspace — perfect for running pnpm dev.
      target: builder

    # pnpm dev = esbuild bundle + node start (from artifacts/api-server/package.json).
    # Source changes → restart this container to rebuild.
    command: ["pnpm", "--filter", "@workspace/api-server", "run", "dev"]

    working_dir: /workspace

    restart: unless-stopped

    environment:
      PORT:               "8000"
      NODE_ENV:           development

      DATABASE_URL:       "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URLENC}@postgres:5432/${POSTGRES_DB:-Astro-sentinel}"
      PYTHON_BACKEND_URL: "ws://python-backend:8001/api/ws"

      JWT_SECRET:         ${JWT_SECRET}
      GOOGLE_CLIENT_ID:   ${GOOGLE_CLIENT_ID}

      GEMINI_API_KEY:     ${GEMINI_API_KEY}
      GEMINI_MODEL:       ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_MS:  ${GEMINI_TIMEOUT_MS:-45000}

      ORCID_CLIENT_ID:    ${ORCID_CLIENT_ID}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET}

    # Mount source directories so changes are visible to pnpm dev builds.
    # node_modules remain in the image (not overridden by mounts).
    volumes:
      - ./artifacts/api-server/src:/workspace/artifacts/api-server/src
      - ./lib:/workspace/lib

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      python-backend:
        condition: service_healthy

    ports:
      # api-server exposed on host port 8000 so the locally-running Vite
      # dev server's proxy (http://127.0.0.1:8000) reaches this container.
      - "8000:8000"

    networks:
      - cosmic-dev

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_dev_data:
    # Separate from prod to allow independent resets.
    # To wipe: docker compose -f docker-compose.dev.yml down -v

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  cosmic-dev:
    driver: bridge
